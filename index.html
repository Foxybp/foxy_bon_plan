<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bons plans du moment</title>

<!-- Empêche le cache HTTP de servir une version périmée de la page -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Favicon (onglet navigateur) -->
<link rel="icon" type="image/png" href="assets/foxy.png">

<!-- Icône écran d'accueil iOS (Safari > Partager > Sur l'écran d'accueil) -->
<link rel="apple-touch-icon" href="assets/foxy.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bons plans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Icône écran d'accueil Android/Chrome (via manifest.json) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#810FF7">

<style>
    body {
        font-family: -apple-system, Helvetica, Arial, sans-serif;
        background: #810FF7;
        margin: 0;
        padding: 0;
    }
    .wrapper {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
    }
    .site-header { text-align: center; padding: 20px 0 10px; }
    .site-header img {
        width: 110px; height: 110px; border-radius: 24px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .site-header h1 {
        font-size: 24px; color: #fff; margin: 16px 0 4px;
    }
    .site-header p {
        color: rgba(255,255,255,0.85); font-size: 14px; margin: 0 0 20px;
    }
    .empty { text-align: center; color: rgba(255,255,255,0.85); margin-top: 40px; }
    .deal-card {
        display: block; background: #fff; border-radius: 12px; padding: 16px;
        margin-bottom: 14px; text-decoration: none; color: inherit;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .deal-card img { width: 100%; max-height: 220px; object-fit: contain; margin-bottom: 10px; }
    .deal-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #111; }
    .price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .price-new { font-size: 20px; font-weight: 700; color: #148c3c; }
    .price-old { font-size: 14px; color: #c81e1e; text-decoration: line-through; }
    .badge { background: #ff9900; color: #fff; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .cta { display: inline-block; margin-top: 10px; font-size: 14px; color: #0d6efd; font-weight: 600; }
    .footer-note { text-align: center; font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 10px; }
</style>
</head>
<body>
    <div class="wrapper">
    <div class="site-header">
        <img src="assets/foxy.png" alt="Logo">
        <h1>🦊 Bons plans du moment</h1>
        <p>Tous les deals actifs, mis à jour automatiquement</p>
    </div>

                        <a class="deal-card" href="https://amzn.to/4ctMcZI" target="_blank" rel="nofollow sponsored">
                                    <img src="https://m.media-amazon.com/images/W/BW_MEDIAX_AVIF_MEASUREMENT_1306696-T1/images/I/71fsTVIN8wL._AC_SL1500_.jpg" alt="">
                                <div class="deal-title">Sèche Cheveux Professionnel</div>
                <div class="price-row">
                    <span class="price-new">39,99 €</span>
                    <span class="price-old">139,99 €</span>
                    <span class="badge">-71%</span>
                </div>
                <span class="cta">Voir l'offre sur Amazon →</span>
            </a>
                <p class="footer-note">Liens affiliés Amazon — en tant que Partenaire Amazon, je perçois une commission sur les achats éligibles, sans coût supplémentaire pour vous.</p>
        </div>
    <script>
        // Les apps ajoutées à l'écran d'accueil (iOS notamment) restaurent
        // souvent l'état mémorisé au lieu de recharger depuis le réseau.
        // On force un rechargement à chaque fois que l'app redevient visible
        // (réouverture depuis l'écran d'accueil, retour au premier plan),
        // pour garantir d'avoir toujours la dernière version des deals.
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                location.reload();
            }
        });
    </script>
</body>
</html>
