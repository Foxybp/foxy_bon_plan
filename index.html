<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bons plans du moment</title>
<style>
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
    h1 { font-size: 22px; text-align: center; margin: 16px 0 24px; }
    .empty { text-align: center; color: #666; margin-top: 40px; }
    .deal-card {
        display: block; background: #fff; border-radius: 12px; padding: 16px;
        margin-bottom: 14px; text-decoration: none; color: inherit;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .deal-card img { width: 100%; max-height: 220px; object-fit: contain; margin-bottom: 10px; }
    .deal-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .price-new { font-size: 20px; font-weight: 700; color: #148c3c; }
    .price-old { font-size: 14px; color: #c81e1e; text-decoration: line-through; }
    .badge { background: #ff9900; color: #fff; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .cta { display: inline-block; margin-top: 10px; font-size: 14px; color: #0d6efd; font-weight: 600; }
</style>
</head>
<body>
    <h1>🔥 Bons plans du moment</h1>

                        <a class="deal-card" href="https://link.amazon/B0iV5EN5S" target="_blank" rel="nofollow sponsored">
                                    <img src="https://m.media-amazon.com/images/I/61Bn5v-hkgL._AC_SY300_SX300_QL70_ML2_.jpg" alt="">
                                <div class="deal-title">Aspirateur Robot Laveur</div>
                <div class="price-row">
                    <span class="price-new">589,98 €</span>
                    <span class="price-old">899,99 €</span>
                    <span class="badge">-34%</span>
                </div>
                <span class="cta">Voir l'offre sur Amazon →</span>
            </a>
                <p style="text-align:center; font-size:12px; color:#999;">Liens affiliés Amazon — en tant que Partenaire Amazon, je perçois une commission sur les achats éligibles, sans coût supplémentaire pour vous.</p>
    </body>
</html>
